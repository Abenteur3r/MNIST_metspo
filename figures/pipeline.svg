   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #272727" x="8.64" y="29.376" transform="rotate(-0 8.64 29.376)">MNIST  /  From tracking to possession spells</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="8.64" y="62.5536" transform="rotate(-0 8.64 62.5536)">Offline CPU inference  ·  no video processing  ·  no target-label fitting</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f4d92" x="22.752" y="117.1584" transform="rotate(-0 22.752 117.1584)">01  PROVIDED INPUTS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(22.752 150.407222)">Tactical tracking</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(22.752 164.786781)">players + ball coordinates</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(22.752 179.166341)"/>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(22.752 193.5459)">Team / goalkeeper metadata</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(22.752 207.925459)">Automatic tactical tags</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f4d92" x="271.1232" y="117.1584" transform="rotate(-0 271.1232 117.1584)">02  REPRESENTATION</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(271.1232 150.407222)">119 tracking / tag features</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(271.1232 164.786781)">+ 119 validity bits</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(271.1232 179.166341)"/>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(271.1232 193.5459)">Player snapshot attention</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(271.1232 207.925459)">+ 128 pooled values</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f4d92" x="519.4944" y="117.1584" transform="rotate(-0 519.4944 117.1584)">03  TEMPORAL ENSEMBLE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(519.4944 150.407222)">366 inputs at 5 Hz</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(519.4944 164.786781)">Two temporal convolution paths</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(519.4944 179.166341)"/>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(519.4944 193.5459)">21 frozen models</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(519.4944 207.925459)">Mean H / A / D probabilities</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f4d92" x="767.8656" y="117.1584" transform="rotate(-0 767.8656 117.1584)">04  DECODE + EXPORT</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(767.8656 150.407222)">Duration-aware dynamic program</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(767.8656 164.786781)">Control-gated team switches</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(767.8656 179.166341)"/>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(767.8656 193.5459)">Expand to 25 Hz</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #272727" transform="translate(767.8656 207.925459)">CSV: 199,319 H / A / D / X rows</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #272727" x="498.3264" y="307.5641" transform="rotate(-0 498.3264 307.5641)">EXTERNAL TRAINING ONLY   7 DFL matches  ×  3 seeds  =  21 leave-one-match-out members</text>
   </g>
  </g>
 </g>
